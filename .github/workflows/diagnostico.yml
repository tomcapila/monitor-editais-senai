# Diagnostica portais de compras numa máquina do GitHub e guarda o resultado
# como artefato. O relatório também sai no log do passo "Diagnosticar".
# Serve para mapear portais novos (ex.: SENAI-SP e SENAI-RJ) antes de escrever
# o coletor, e para investigar quando uma coleta começa a falhar.
name: Diagnóstico de portais

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs abertas no navegador, separadas por espaço (vazio = portais do Sebrae em MG, RJ e SP)"
        required: false
        default: ""
      apis:
        description: "URLs de API consultadas direto, separadas por espaço (vazio = nenhuma)"
        required: false
        default: ""
  # Também roda quando o diagnóstico ou os coletores mudam num branch de
  # trabalho do Claude, porque "Run workflow" só aparece depois que o arquivo
  # chega ao main.
  push:
    branches: ["claude/**"]
    paths:
      - .github/workflows/diagnostico.yml
      - app/diagnostico.py
      - app/coletores/**
      - config.yaml
      - scripts/diagnostico_portais.py
      - scripts/testar_fontes.py

permissions:
  contents: read

concurrency:
  group: diagnostico
  cancel-in-progress: true

env:
  TZ: America/Sao_Paulo
  # Sebrae (MG, RJ, SP): Canal do Fornecedor (licitações de todo o Sistema
  # Sebrae), SGF (credenciamento nacional, usado pelo Sebrae/RJ), Sebrae One
  # (credenciamento do Sebrae Minas), SOMA (credenciamento do Sebrae-SP) e as
  # páginas de licitação de cada estado no portal do Sebrae.
  URLS_PADRAO: >-
    https://www.scf3.sebrae.com.br/portalcf/Licitacoes
    https://sgf.sebrae.com.br/Home/
    https://credenciamento.sebraemg.com.br/
    https://credenciamento.sebraemg.com.br/edital/63
    https://contato.sebraesp.com.br/soma/
    https://sebrae.com.br/sites/PortalSebrae/ufs/mg/licitacao_uf
    https://sebrae.com.br/sites/PortalSebrae/ufs/rj/licitacao_uf
    https://sebrae.com.br/sites/PortalSebrae/ufs/sp/licitacao_uf?codUf=26
  APIS_PADRAO: ""

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt openpyxl
          python -m playwright install --with-deps chromium

      - name: Diagnosticar
        env:
          URLS: ${{ inputs.urls }}
          APIS: ${{ inputs.apis }}
        # set -f: o "?" das URLs não pode ser lido como curinga de arquivo
        run: |
          set -f
          python scripts/diagnostico_portais.py --todos-links ${URLS:-$URLS_PADRAO} \
            --api ${APIS:-$APIS_PADRAO}

      # Roda os coletores de verdade (sem banco) e mostra o que cada fonte trouxe
      - name: Testar as fontes do config.yaml
        if: always()
        run: python scripts/testar_fontes.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico
          path: diagnostico/portais
          if-no-files-found: warn
          retention-days: 14
