# Diagnostica portais de compras numa máquina do GitHub e guarda o resultado
# como artefato. O relatório também sai no log do passo "Diagnosticar".
# Serve para mapear portais novos (ex.: SENAI-SP e SENAI-RJ) antes de escrever
# o coletor, e para investigar quando uma coleta começa a falhar.
name: Diagnóstico de portais

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs abertas no navegador, separadas por espaço (vazio = portais de SP e RJ)"
        required: false
        default: ""
      apis:
        description: "URLs de API consultadas direto, separadas por espaço (vazio = API de transparência do SENAI-SP)"
        required: false
        default: ""
  # Também roda quando o diagnóstico ou os coletores mudam num branch de
  # trabalho do Claude, porque "Run workflow" só aparece depois que o arquivo
  # chega ao main.
  push:
    branches: ["claude/**"]
    paths:
      - .github/workflows/diagnostico.yml
      - app/diagnostico.py
      - app/coletores/**
      - config.yaml
      - scripts/diagnostico_portais.py
      - scripts/testar_fontes.py

permissions:
  contents: read

concurrency:
  group: diagnostico
  cancel-in-progress: true

env:
  TZ: America/Sao_Paulo
  # RJ: Portal de Compras Firjan (Paradigma). SP: páginas de transparência do
  # SENAI-SP (o portal de fornecedores SAP exige preencher a busca e ficou de fora).
  URLS_PADRAO: >-
    https://portaldecompras.firjan.com.br/portal/Mural.aspx?nNmTela=E
    https://transparencia.sp.senai.br/licitacoes/licitacoes-editais
  # API de transparência do SENAI-SP (a mesma dos botões "Salvar em XLSX")
  APIS_PADRAO: >-
    https://sistematransparenciaweb.com.br/api-licitacoes/publico/licitacoes?ano=2026&departamento=SENAI-SP&entidade=SENAI
    https://sistematransparenciaweb.com.br/api-licitacoes/publico/licitacoes?ano=2025&departamento=SENAI-SP&entidade=SENAI

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt openpyxl
          python -m playwright install --with-deps chromium

      - name: Diagnosticar
        env:
          URLS: ${{ inputs.urls }}
          APIS: ${{ inputs.apis }}
        # set -f: o "?" das URLs não pode ser lido como curinga de arquivo
        run: |
          set -f
          python scripts/diagnostico_portais.py --todos-links ${URLS:-$URLS_PADRAO} \
            --api ${APIS:-$APIS_PADRAO}

      # Roda os coletores de verdade (sem banco) e mostra o que cada fonte trouxe
      - name: Testar as fontes do config.yaml
        if: always()
        run: python scripts/testar_fontes.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico
          path: diagnostico/portais
          if-no-files-found: warn
          retention-days: 14
